name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Resolve dependencies
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check packages
        run: moon check --deny-warn

      - name: Run tests
        run: moon test --deny-warn

      - name: Smoke test CLI
        run: moon run cmd/main -- examples/mixed-app --format markdown

      - name: Verify Windows bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-bootstrap.ps1

      - name: Build native executable
        run: moon build --target native --deny-warn

      - name: Verify real Windows deployment
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-deployment.ps1
